# 2026학년도 대학수학능력시험 (2025.11 시행) 수학 미적분 30번 — 역함수의 그래프로 교점 개수 g(m) 읽기 (정답 11)
# Explainer Studio 로 작성 · 제작 과정 가이드: docs/guide_suneung_calc30.md
# 렌더: python -m explainer build projects/2026_suneung_calc30/project.yaml

meta:
  id: 2026_suneung_calc30
  title: "2026학년도 수능 미적분 30번"
  subtitle: "역함수의 그래프에서 교점의 개수 g(m) 읽기"
  voice: ko-KR-InJoonNeural
  rate: "+4%"
  resolution: 1080p
  fps: 30
  subtitles: burn
  segment_pad: 1.0
  style: chalkboard
  background: "#101614"

params:
  k_b: "2.34575"            # k ln k = 2 의 해 (접하는 순간의 역함수 쪽 기울기)
  b: "1/k_b"                # 원함수 쪽 기울기 m = 1/k  → 불연속점 b ≈ 0.4263
  t: "-1-log(k_b)"          # 접점의 x좌표 (x < -1)  ≈ -1.853

layout:
  graph:
    x_range: [-3.5, 3.5, 1]
    y_range: [-4.5, 4.5, 1]
