exam: "2026학년도 대학수학능력시험"
section: "수학 공통"
source: "한국교육과정평가원"
brand: "수학 한수"

problems:
  - id: 22
    topic: "지수·로그함수"
    points: 4
    question_latex: 'y=2^x+\frac{k}{2},\quad y=\frac{k}{2^x}+k-2\;(k>1)'
    question_note: "두 곡선의 교점 A, 곡선 y=2^{x-2}-3 위의 점 B."
    question_latex_2: '\triangle AOB\ \text{의 넓이가}\ 16'
    question_note_2: '일 때, k+\log_2 k=\dfrac{q}{p} (p,q 서로소) → p+q=?'
    choices: []
    answer: "38"
    answer_value: 38
    visual:
      template: custom
      x_range: [-1, 6]
      y_range: [-2, 12]
    steps:
      - narration: "교점 A에서 t=2^x로 치환합니다. t+k/2 = k/t + k−2에서 t=k/2."
        latex: '2t^2+(4-k)t-2k=0 \;\Rightarrow\; t=\frac{k}{2}'
        caption: "교점 A: t=2^x=k/2"
      - narration: "따라서 A의 좌표는 (log₂k−1, k)입니다."
        latex: 'A=\left(\log_2 k-1,\,k\right)'
        caption: "A=(log₂k−1, k)"
      - narration: "A를 지나 기울기 −1인 직선 위 점 B. x가 3 증가, y가 3 감소."
        latex: 'x+y=k+\log_2 k-1,\quad B=(\log_2 k+2,\,k-3)'
        caption: "직선 x+y=k+log₂k−1"
      - narration: "AB=3√2. △AOB 넓이 16에서 원점-직선 거리 h를 구합니다."
        latex: '16=\frac{1}{2}\cdot3\sqrt{2}\cdot h \;\Rightarrow\; h=\frac{16\sqrt{2}}{3}'
        caption: "넓이 → 원점-직선 거리"
      - narration: "거리 공식으로 k+log₂k−1=32/3. 따라서 k+log₂k=35/3, p+q=38."
        latex: 'k+\log_2 k=\frac{35}{3} \;\Rightarrow\; p+q=38'
        caption: "정답 p+q=38"
