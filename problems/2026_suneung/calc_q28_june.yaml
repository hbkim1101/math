exam: "2026학년도 6월 모의평가"
section: "미적분 (선택)"
source: "한국교육과정평가원"

problems:
  - id: 28
    topic: "합성함수 · 변곡점 접선"
    points: 4
    question_latex: '(f(x))^5+(f(x))^3+ax+b=\ln\left(x^2+x+\frac{5}{2}\right)'
    question_note: 'f(-3)f(3)<0,\quad f''(2)>0'
    answer: "① $-3e^{-4/3}$"
    lecture:
      slug: "2026_june_q28"
      voice: "ko-KR-InJoonNeural"
      background: "#0f0f1a"
      header:
        title: "2026학년도 6월 모평 · 미적분 28번"
        subtitle: "자동 강의 엔진 (YAML → MP4)"
      steps:
        - type: narrate
          text: "26학년도 6월 미적분 28번, 같이 풀어볼게요. 겉으로는 복잡해 보이지만, 핵심은 합성함수입니다."
        - type: problem
        - type: fade_out
          target: board

        - type: narrate
          text: "조건 (가)를 이항하면, g(f(x))는 h(x)와 같아요. g(y)는 y 다섯제곱 더하기 y 세제곱, h(x)는 로그 빼기 ax 더하기 b 입니다."
        - type: latex_block
          items:
            - 'g(y)=y^5+y^3'
            - 'g(f(x))=h(x)'
            - 'h(x)=\ln\left(x^2+x+\frac{5}{2}\right)-ax-b'
          colors: ["purple", "yellow", "white"]
        - type: clear

        - type: narrate
          text: "먼저 겉함수 g(y) equals y 다섯제곱 더하기 y 세제곱 그래프를 그려볼게요. 영점에서만 삼차처럼 움직이는, 기울기가 항상 양수인 함수예요."
        - type: graph
          axes: { x_range: [-1.6, 1.6, 0.5], y_range: [-1.2, 1.2, 0.5], x_len: 7, y_len: 4.5 }
          curves:
            - preset: g_y5_y3
              x_plot: [-1.4, 1.4]
              color: purple
              label_latex: "y=g(t)=t^5+t^3"
          dots:
            - { x: 0, y: 0, color: yellow }
        - type: clear

        - type: narrate
          text: "조건 (나) f(-3) f(3)이 음수이므로, 사잇값 정리로 열린구간 (-3, 3) 안에 f(c) equals 0인 c가 반드시 존재합니다."
        - type: number_line
          x_range: [-3.5, 3.5, 1]
          markers:
            - { x: -3, label_latex: "f(-3)<0", color: red }
            - { x: 3, label_latex: "f(3)>0", color: blue }
            - { x: -2, label_latex: "f(c)=0", color: yellow }
        - type: clear

        - type: narrate
          text: "f(c)가 0이면 g(f(c))도 0이므로, h(c) equals 0 입니다. 로그 그래프에서 직선 y equals ax 더하기 b 가 x equals c 를 지나야 해요."
        - type: latex
          content: 'g(0)=0 \Rightarrow h(c)=0'
          font_size: 34
          color: yellow
        - type: clear

        - type: narrate
          text: "f가 이계도함수이려면, h(x)는 c 근처에서 최소 삼차식으로 0에 접근해야 합니다. 그래서 h(c), h 프라임 c, h 더블프라임 c 가 모두 0이 됩니다."
        - type: latex
          content: 'h(c)=h''(c)=h''(c)=0'
          font_size: 32
          color: highlight
        - type: clear

        - type: narrate
          text: "h(x)의 이계도함수를 계산하면, c equals -2 또는 c equals 1 입니다. 둘 다 로그 함수의 변곡점이에요."
        - type: latex_block
          items:
            - 'h''(x)=\frac{-2(x+2)(x-1)}{Q(x)^2}'
            - 'c=-2 \quad \text{or} \quad c=1'
          colors: ["white", "yellow"]
        - type: clear

        - type: narrate
          text: "이제 y equals ln(x 제곱 더하기 x 더하기 5/2) 그래프를 그립니다. x equals -2 와 x equals 1 에서 오목·볼록이 바뀌죠."
        - type: graph
          axes: { x_range: [-3.5, 3.0, 1], y_range: [-1.5, 3.0, 1], x_len: 8, y_len: 4.2 }
          curves:
            - preset: june28_ln
              x_plot: [-3.0, 2.5]
              color: blue
              label_latex: 'y=\ln\left(x^2+x+\frac{5}{2}\right)'
          dots:
            - { x: -2, preset_y: june28_ln, color: red, label_latex: "x=-2" }
            - { x: 1, preset_y: june28_ln, color: red, label_latex: "x=1" }
        - type: clear

        - type: narrate
          text: "변곡점에서의 접선이 두 개 후보입니다. 왼쪽 접선은 기울기 a가 음수, 오른쪽은 a가 양수예요."
        - type: graph
          axes: { x_range: [-3.5, 3.0, 1], y_range: [-1.5, 3.0, 1], x_len: 8, y_len: 4.2 }
          shift: [0, 0]
          curves:
            - preset: june28_ln
              x_plot: [-3.0, 2.5]
              color: blue
          tangents:
            - { at_x: -2, color: yellow }
            - { at_x: 1, color: orange }
        - type: clear

        - type: narrate
          text: "f 프라임 2가 0보다 크므로, h(x)는 x equals 2 에서 증가해야 합니다. 따라서 왼쪽 변곡점 접선, x equals -2 가 정답입니다."
        - type: latex
          content: 'c=-2,\quad a=-\frac{2}{3}'
          font_size: 30
          color: yellow
        - type: clear

        - type: narrate
          text: "x equals -2 에서 접선의 기울기 a는 -2/3, b는 ln 9/2 빼기 4/3 입니다."
        - type: latex_block
          items:
            - 'a=-\frac{2}{3}'
            - 'b=\ln\frac{9}{2}-\frac{4}{3}'
          colors: ["yellow", "white"]
        - type: clear

        - type: narrate
          text: "구하는 값 a times e to the b 는 -3 times e to the minus 4/3. 정답은 1번입니다."
        - type: answer
          latex: 'a\times e^b=-3e^{-\frac{4}{3}}'
          label: "정답  ①"
